<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CoPart Check — Login</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  body{
    font-family:system-ui,-apple-system,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    height:100vh;
    margin:0;
    background:#F7F6F4;
  }
  .card{
    background:#fff;
    padding:32px 28px;
    border-radius:12px;
    box-shadow:0 8px 24px rgba(0,0,0,.12);
    text-align:center;
    max-width:320px;
    width:100%;
  }
  h1{
    font-size:16px;
    margin:0 0 4px;
    color:#1C1C1E;
  }
  p{
    font-size:12.5px;
    color:#6B6B70;
    margin:0 0 20px;
  }
  #gsiButton{
    display:flex;
    justify-content:center;
  }
  #status{
    font-size:12px;
    color:#6B6B70;
    margin-top:14px;
    min-height:16px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>CoPart Check</h1>
    <p>Masuk dengan akun Google untuk melanjutkan</p>
    <div id="gsiButton"></div>
    <div id="status"></div>
  </div>

<script>
// Ganti dengan Client ID dari Google Cloud Console (Credentials > OAuth client ID)
const CLIENT_ID = '462897222286-qpm8tndkc6ruiin5ofa240la5p15lfvu.apps.googleusercontent.com';

function handleCredentialResponse(response){
  document.getElementById('status').textContent = 'Berhasil masuk, menutup jendela...';
  if(window.opener){
    window.opener.postMessage({ type: 'copart-login', idToken: response.credential }, '*');
  }
  setTimeout(function(){ window.close(); }, 400);
}

window.onload = function(){
  if(typeof google === 'undefined' || !google.accounts){
    document.getElementById('status').textContent = 'Gagal memuat layanan Google Sign-In.';
    return;
  }
  google.accounts.id.initialize({
    client_id: CLIENT_ID,
    callback: handleCredentialResponse
  });
  google.accounts.id.renderButton(document.getElementById('gsiButton'), {
    theme: 'outline',
    size: 'large',
    width: 260
  });
};
</script>
</body>
</html>
